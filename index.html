html{scroll-behavior:smooth}
body{

.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em}

.navlinks{display:flex;gap:22px;font-size:.9rem;color:#dfe1ea}

.actions{display:flex;gap:8px}
.btn{
  border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;

}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:var(--primary);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-dark)}
.hero{

}
.hero:after{
  content:"";position:absolute;width:520px;height:520px;border-radius:50%;
  background:rgba(103,99,190,.28);right:-180px;top:-230px;filter:blur(3px)
}
.hero-grid{display:grid;grid-template-columns:180px 1fr;gap:38px;align-items:center;position:relative;z-index:1}
.avatar{

.avatar img{width:100%;height:100%;object-fit:cover}
.eyebrow{color:#bdb9ff;text-transform:uppercase;letter-spacing:.15em;font-size:.78rem;font-weight:800}
h1{font-size:clamp(2.5rem,6vw,4.8rem);line-height:1.02;margin:8px 0 12px;letter-spacing:-.05em}

.contact{display:flex;flex-wrap:wrap;gap:10px}
.contact a,.contact span{

  border:1px solid rgba(255,255,255,.1);font-size:.9rem

.contact a:hover{background:rgba(255,255,255,.14)}
main{padding:38px 0 70px}
.layout{display:grid;grid-template-columns:1fr 330px;gap:28px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section{padding:30px}
.section + .section{margin-top:22px}
.section-head{display:flex;align-items:end;gap:15px;margin-bottom:24px}
.num{color:var(--primary);font-weight:900;font-size:.78rem;letter-spacing:.15em}
.section h2{margin:0;font-size:1.55rem;letter-spacing:-.025em}
.section-intro{color:var(--muted);margin-top:-12px;margin-bottom:22px}
.profile p{font-size:1.02rem;color:#42465a}
.profile strong{color:var(--ink)}
.skills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.skill{
  padding:20px;border:1px solid var(--line);border-radius:16px;background:#fbfbfd;
  transition:.2s transform,.2s box-shadow

.skill:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(43,45,66,.08)}
.skill h3{font-size:1rem;margin:0 0 10px;color:var(--primary-dark)}
.skill ul,.job ul,.side-list{padding-left:19px;margin:0}
.skill li,.job li{margin:4px 0;color:#555a6d}
.job{padding:0 0 30px;margin-bottom:30px;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.job-top{display:flex;justify-content:space-between;gap:20px}
.job h3{margin:0;font-size:1.25rem}
.job-company{color:var(--primary);font-weight:800}
.job-meta{text-align:right;color:var(--muted);font-size:.86rem;white-space:nowrap}
.job p{color:#555a6d;margin:10px 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tag{background:#efeffa;color:var(--primary-dark);border-radius:999px;padding:4px 9px;font-size:.75rem;font-weight:800}
.timeline{border-left:2px solid #deddf3;padding-left:20px}
.timeline-item{position:relative;margin-bottom:20px}
.timeline-item:before{content:"";position:absolute;left:-27px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px #eeeefa}

.timeline-item strong{display:block}
.timeline-item span{color:var(--muted);font-size:.86rem}

.side-card{padding:25px}
.side-card + .side-card{margin-top:18px}
.side-card h3{margin:0 0 16px;font-size:1rem}
.pill-list{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid var(--line);padding:5px 9px;border-radius:999px;font-size:.78rem;color:#555a6d;background:#fff}
.language{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.language:last-child{border:0}
.language span{color:var(--muted)}
footer{background:var(--ink);color:#bfc2d0;text-align:center;padding:28px}
.reveal{opacity:0;transform:translateY(14px);transition:.55s ease}
.reveal.visible{opacity:1;transform:none}
@media(max-width:950px){

@media(max-width:680px){

  .section{padding:22px}.skills-grid{grid-template-columns:1fr}
  .job-top{flex-direction:column;gap:4px}.job-meta{text-align:left;white-space:normal}

@media print{

let lang = localStorage.getItem("cv-lang") || "fr";
const $ = s => document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function render(){
 const d=DATA[lang];
 document.documentElement.lang=lang;
 document.title=`Baptiste Calin — ${lang==="fr"?"IT Leader":"IT Leader"}`;
 document.querySelectorAll("[data-i18n]").forEach(el=>{
   const path=el.dataset.i18n.split(".");
   let v=d; path.forEach(k=>v=v[k]); el.textContent=v;
 });
 document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=d[el.dataset.i18nHtml]);
 $("#lang").textContent=lang==="fr"?"EN":"FR";
 $("#skillsGrid").innerHTML=d.skillCats.map(([title,items])=>`<article class="skill"><h3>${esc(title)}</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></article>`).join("");
 $("#jobs").innerHTML=d.jobs.map(j=>`<article class="job"><div class="job-top"><div><h3>${esc(j.role)}</h3><div class="job-company">${esc(j.company)}</div></div><div class="job-meta"><strong>${esc(j.place)}</strong><br>${esc(j.date)}</div></div><p>${esc(j.desc)}</p><ul>${j.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="tags">${j.tags.split("|").map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></article>`).join("");
 $("#education").innerHTML=d.education.map(x=>`<div class="timeline-item"><strong>${esc(x)}</strong></div>`).join("");
 $("#management").innerHTML=d.management.map(x=>`<li>${esc(x)}</li>`).join("");
 $("#tools").innerHTML=d.tools.map(x=>`<span class="pill">${esc(x)}</span>`).join("");
 $("#languages").innerHTML=d.languages.map(([a,b])=>`<div class="language"><strong>${esc(a)}</strong><span>${esc(b)}</span></div>`).join("");
 localStorage.setItem("cv-lang",lang);
}
$("#lang").addEventListener("click",()=>{lang=lang==="fr"?"en":"fr";render()});
$("#print").addEventListener("click",()=>window.print());
$("#year").textContent=new Date().getFullYear();
render();

const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add("visible")}),{threshold:.08});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
